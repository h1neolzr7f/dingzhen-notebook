name: 缺陷
description: 报告一个可以复现的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请不要粘贴粉笔账号、密码、Cookie、真实试卷截图或本机数据库。
        安全问题请走 [SECURITY.md](https://github.com/h1neolzr7f/dingzhen-notebook/blob/main/SECURITY.md)。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: "1.3.4"
  - type: dropdown
    id: side
    attributes:
      label: 哪一端
      options:
        - Windows 桌面
        - Android 丁真笔记本
        - 两边都有
