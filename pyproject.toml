[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fenbi-study-pipeline"
version = "1.3.4"
description = "Local-first screenshot, review, and export pipeline for personal Fenbi study data"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Jinja2==3.1.6",
  "opencv-contrib-python==4.10.0.84",
  "Pillow==12.2.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "PyMuPDF==1.27.2.3",
  "PySide6==6.11.1",
  "reportlab==5.0.0",
  "SQLAlchemy==2.0.51",
]

[project.optional-dependencies]
ocr = ["paddleocr==3.7.0", "paddlepaddle==3.3.1"]
dev = ["pytest==9.0.3", "pytest-cov==7.0.0", "pyinstaller==6.21.0"]

[project.scripts]
fenbi-study = "apps.desktop.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
